name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Lint — fast, runs on every push and PR
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Syntax check (bash -n)
        run: bash -n llmstack-macos.sh

      - name: Shellcheck (configured only by .shellcheckrc)
        run: |
          shellcheck --version
          shellcheck -x llmstack-macos.sh

      - name: Verify shebang
        run: |
          head -1 llmstack-macos.sh | grep -q '^#!/bin/bash' \
            || { echo "FAIL: shebang is not #!/bin/bash"; exit 1; }

  # ===========================================================================
  # CLI Tests — runs on Ubuntu; tests argument handling, output, catalogue
  # ===========================================================================
  test:
    name: CLI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Make executable
        run: chmod +x llmstack-macos.sh

      # ---------------------------------------------------------------------
      # Help and version
      # ---------------------------------------------------------------------
      - name: '--help exits 0'
        run: ./llmstack-macos.sh --help

      - name: '-h exits 0'
        run: ./llmstack-macos.sh -h

      - name: '--help mentions all modes'
        run: |
          output=$(./llmstack-macos.sh --help)
          for mode in --install --update --status --recommend --sync-models --uninstall --version --help; do
            echo "$output" | grep -q -- "$mode" \
              || { echo "FAIL: --help does not mention $mode"; exit 1; }
          done

      - name: '--version exits 0 and prints version'
        run: |
          output=$(./llmstack-macos.sh --version)
          echo "$output"
          echo "$output" | grep -qE 'v[0-9]+\.[0-9]+' \
            || { echo "FAIL: no version number found"; exit 1; }

      # ---------------------------------------------------------------------
      # Argument validation — commands expected to fail (exit 1)
      # ---------------------------------------------------------------------
      - name: 'Unknown argument exits 1'
        run: |
          set +e
          ./llmstack-macos.sh --bogus-arg 2>/dev/null
          rc=$?
          [ "$rc" -eq 1 ] || { echo "FAIL: expected exit 1, got $rc"; exit 1; }

      - name: 'Invalid port (non-numeric) exits 1'
        run: |
          set +e
          ./llmstack-macos.sh --webui-port abc 2>/dev/null
          rc=$?
          [ "$rc" -eq 1 ] || { echo "FAIL: expected exit 1, got $rc"; exit 1; }

      - name: 'Invalid port (out of range high) exits 1'
        run: |
          set +e
          ./llmstack-macos.sh --webui-port 99999 2>/dev/null
          rc=$?
          [ "$rc" -eq 1 ] || { echo "FAIL: expected exit 1, got $rc"; exit 1; }

      - name: 'Invalid port (zero) exits 1'
        run: |
          set +e
          ./llmstack-macos.sh --searxng-port 0 2>/dev/null
          rc=$?
          [ "$rc" -eq 1 ] || { echo "FAIL: expected exit 1, got $rc"; exit 1; }

      - name: 'Invalid port (negative) exits 1'
        run: |
          set +e
          ./llmstack-macos.sh --webui-port -1 2>/dev/null
          rc=$?
          [ "$rc" -eq 1 ] || { echo "FAIL: expected exit 1, got $rc"; exit 1; }

      - name: 'Missing value for --searxng-url exits 1'
        run: |
          set +e
          ./llmstack-macos.sh --searxng-url 2>/dev/null
          rc=$?
          [ "$rc" -eq 1 ] || { echo "FAIL: expected exit 1, got $rc"; exit 1; }

      - name: 'Missing value for --model exits 1'
        run: |
          set +e
          ./llmstack-macos.sh --model 2>/dev/null
          rc=$?
          [ "$rc" -eq 1 ] || { echo "FAIL: expected exit 1, got $rc"; exit 1; }

      - name: 'Missing value for --webui-port exits 1'
        run: |
          set +e
          ./llmstack-macos.sh --webui-port 2>/dev/null
          rc=$?
          [ "$rc" -eq 1 ] || { echo "FAIL: expected exit 1, got $rc"; exit 1; }

      - name: 'Missing value for --searxng-port exits 1'
        run: |
          set +e
          ./llmstack-macos.sh --searxng-port 2>/dev/null
          rc=$?
          [ "$rc" -eq 1 ] || { echo "FAIL: expected exit 1, got $rc"; exit 1; }

      # ---------------------------------------------------------------------
      # --recommend
      # ---------------------------------------------------------------------
      - name: '--recommend produces hardware report'
        run: |
          set +e
          output=$(./llmstack-macos.sh --recommend 2>&1)
          rc=$?
          echo "$output"
          [ "$rc" -eq 0 ] || { echo "FAIL: --recommend exited with code $rc"; exit 1; }
          echo "$output" | grep -q "DETECTED SYSTEM" \
            || { echo "FAIL: no DETECTED SYSTEM header"; exit 1; }

      - name: '--recommend writes the catalogue file'
        run: |
          [ -f "$HOME/.config/llmstack/models.catalog" ] \
            || { echo "FAIL: catalogue not written"; exit 1; }

      - name: '--recommend shows catalogue staleness info'
        run: |
          set +e
          output=$(./llmstack-macos.sh --recommend 2>&1)
          echo "$output" | grep -qi "catalogue" \
            || { echo "FAIL: no catalogue mention"; exit 1; }

      - name: '--recommend does not overwrite existing catalogue'
        run: |
          # Corrupt the date line, re-run, confirm it's preserved
          sed -i 's/^# Last-Updated:.*/# Last-Updated: 1999-01-01/' \
            "$HOME/.config/llmstack/models.catalog"
          set +e
          output=$(./llmstack-macos.sh --recommend 2>&1)
          grep -q '^# Last-Updated: 1999-01-01' \
            "$HOME/.config/llmstack/models.catalog" \
            || { echo "FAIL: catalogue was overwritten"; exit 1; }
          echo "Catalogue preserved across runs"

      # ---------------------------------------------------------------------
      # --status
      # ---------------------------------------------------------------------
      - name: '--status reports component health'
        run: |
          set +e
          output=$(./llmstack-macos.sh --status 2>&1)
          rc=$?
          echo "$output"
          echo "Exit code: $rc"
          echo "$output" | grep -q "Ollama" \
            || { echo "FAIL: no Ollama line"; exit 1; }
          echo "$output" | grep -q "Open WebUI" \
            || { echo "FAIL: no Open WebUI line"; exit 1; }
          echo "$output" | grep -q "SearXNG" \
            || { echo "FAIL: no SearXNG line"; exit 1; }

      # ---------------------------------------------------------------------
      # Catalogue format validation
      # ---------------------------------------------------------------------
      - name: 'Catalogue has Last-Updated date'
        run: |
          grep -q '^# Last-Updated:' "$HOME/.config/llmstack/models.catalog" \
            || { echo "FAIL: no Last-Updated line"; exit 1; }

      - name: 'Catalogue data lines have 7 pipe-delimited fields'
        run: |
          grep -v '^#' "$HOME/.config/llmstack/models.catalog" \
            | grep -v '^$' \
            | awk -F'|' '{
                if (NF != 7) {
                  printf "FAIL: line has %d fields (expected 7): %s\n", NF, $0
                  exit 1
                }
              }'
          echo "All data lines have 7 fields"

      - name: 'Catalogue tags match ollama name[:tag] format'
        run: |
          grep -v '^#' "$HOME/.config/llmstack/models.catalog" \
            | grep -v '^$' \
            | awk -F'|' '{
                gsub(/^[ \t]+|[ \t]+$/, "", $2)
                if ($2 !~ /^[a-zA-Z0-9._:-]+$/) {
                  printf "FAIL: invalid tag format: %s\n", $2
                  exit 1
                }
              }'
          echo "All tags match expected format"

      - name: 'Catalogue VERIFIED column is yes or no'
        run: |
          grep -v '^#' "$HOME/.config/llmstack/models.catalog" \
            | grep -v '^$' \
            | awk -F'|' '{
                gsub(/^[ \t]+|[ \t]+$/, "", $6)
                if ($6 != "yes" && $6 != "no") {
                  printf "FAIL: VERIFIED column is '%s' (expected yes or no)\n", $6
                  exit 1
                }
              }'
          echo "VERIFIED column OK"

      - name: 'Catalogue ARCH column is moe or dense'
        run: |
          grep -v '^#' "$HOME/.config/llmstack/models.catalog" \
            | grep -v '^$' \
            | awk -F'|' '{
                gsub(/^[ \t]+|[ \t]+$/, "", $4)
                if ($4 != "moe" && $4 != "dense") {
                  printf "FAIL: ARCH column is '%s' (expected moe or dense)\n", $4
                  exit 1
                }
              }'
          echo "ARCH column OK"

      - name: 'Catalogue ROLE column uses known values'
        run: |
          grep -v '^#' "$HOME/.config/llmstack/models.catalog" \
            | grep -v '^$' \
            | awk -F'|' '{
                gsub(/^[ \t]+|[ \t]+$/, "", $5)
                if ($5 !~ /^(daily|coding|vision|light|reasoning)$/) {
                  printf "FAIL: ROLE column is '%s'\n", $5
                  exit 1
                }
              }'
          echo "ROLE column OK"

      - name: 'Catalogue has at least one verified daily driver'
        run: |
          grep -v '^#' "$HOME/.config/llmstack/models.catalog" \
            | grep -v '^$' \
            | awk -F'|' '
                { gsub(/^[ \t]+|[ \t]+$/, "", $5); gsub(/^[ \t]+|[ \t]+$/, "", $6) }
                $5 == "daily" && $6 == "yes" { found=1 }
                END { if (!found) { print "FAIL: no verified daily driver"; exit 1 } }
              '
          echo "At least one verified daily driver present"

      # ---------------------------------------------------------------------
      # Model selection on simulated hardware (v3.4.0)
      # Stub sysctl and ioreg executables are put first on PATH, per command
      # only, to impersonate specific Apple chips. Each run uses its own HOME
      # so the main catalogue above is untouched.
      # ---------------------------------------------------------------------
      - name: 'Set up hardware simulator'
        run: |
          mkdir -p "$RUNNER_TEMP/fakebin"
          cat > "$RUNNER_TEMP/fakebin/sysctl" <<'EOF'
          #!/bin/bash
          [ "$1" = "-n" ] && shift
          case "$1" in
            machdep.cpu.brand_string) echo "$FAKE_CHIP" ;;
            hw.ncpu)    echo "$FAKE_NCPU" ;;
            hw.memsize) echo $(( FAKE_RAM_GB * 1024 * 1024 * 1024 )) ;;
            *) exit 1 ;;
          esac
          EOF
          cat > "$RUNNER_TEMP/fakebin/ioreg" <<'EOF'
          #!/bin/bash
          [ -n "${FAKE_GPU:-}" ] || exit 1
          printf '  | "gpu-core-count" = %s\n' "$FAKE_GPU"
          EOF
          # usage: simulate CHIP NCPU RAM_GB [GPU_CORES] [CATALOG_FILE]
          cat > "$RUNNER_TEMP/simulate.sh" <<'EOF'
          simulate() {
            local h; h="$(mktemp -d)"
            if [ -n "${5:-}" ]; then
              mkdir -p "$h/.config/llmstack"
              cp "$5" "$h/.config/llmstack/models.catalog"
            fi
            HOME="$h" PATH="$RUNNER_TEMP/fakebin:$PATH" \
              FAKE_CHIP="$1" FAKE_NCPU="$2" FAKE_RAM_GB="$3" FAKE_GPU="${4:-}" \
              ./llmstack-macos.sh --recommend 2>&1
            rm -rf "$h"
          }
          # usage: FAKE_* env set by caller; sync CHIP NCPU RAM_GB ANSWERS [CATALOG_FILE]
          # ANSWERS is one y/n per prompt, space-separated, fed on stdin.
          sync() {
            local h; h="$(mktemp -d)"
            if [ -n "${5:-}" ]; then
              mkdir -p "$h/.config/llmstack"
              cp "$5" "$h/.config/llmstack/models.catalog"
            fi
            : > "$RUNNER_TEMP/ollama.log"
            # Not called inside $(...): SYNC_RC, SYNC_HOME and out must reach the step.
            SYNC_RC=0
            printf '%s\n' $4 | HOME="$h" PATH="$RUNNER_TEMP/fakebin:$PATH" \
              FAKE_CHIP="$1" FAKE_NCPU="$2" FAKE_RAM_GB="$3" FAKE_GPU="" \
              FAKE_DISK_GB="${FAKE_DISK_GB:-500}" \
              FAKE_OLLAMA_LOG="$RUNNER_TEMP/ollama.log" \
              ./llmstack-macos.sh --sync-models > "$RUNNER_TEMP/sync.out" 2>&1 || SYNC_RC=$?
            SYNC_HOME="$h"
            out="$(cat "$RUNNER_TEMP/sync.out")"
            echo "$out"
          }
          called()     { grep -qxF -- "$1" "$RUNNER_TEMP/ollama.log" || { echo "FAIL [$label]: expected ollama call '$1'"; cat "$RUNNER_TEMP/ollama.log"; exit 1; }; echo "ok   [$label] called '$1'"; }
          not_called() { if grep -qxF -- "$1" "$RUNNER_TEMP/ollama.log"; then echo "FAIL [$label]: unexpected ollama call '$1'"; exit 1; fi; echo "ok   [$label] not called '$1'"; }
          expect() { echo "$out" | grep -qE -- "$1" || { echo "FAIL [$label]: expected /$1/"; echo "$out"; exit 1; }; echo "ok   [$label] /$1/"; }
          reject() { if echo "$out" | grep -qE -- "$1"; then echo "FAIL [$label]: unexpected /$1/"; echo "$out"; exit 1; fi; echo "ok   [$label] not /$1/"; }
          EOF
          cat > "$RUNNER_TEMP/fakebin/ollama" <<'EOF'
          #!/bin/bash
          echo "$*" >> "$FAKE_OLLAMA_LOG"
          case "$1" in
            list)
              [ -z "${FAKE_OLLAMA_DOWN:-}" ] || { echo "Error: could not connect to ollama" >&2; exit 1; }
              echo "NAME                      ID              SIZE      MODIFIED"
              for m in ${FAKE_OLLAMA_MODELS:-}; do echo "$m    0123456789ab    4.1 GB    2 weeks ago"; done ;;
            pull)
              case " ${FAKE_PULL_FAIL:-} " in *" $2 "*) echo "Error: pull failed" >&2; exit 1 ;; esac ;;
            rm) echo "deleted '$2'" ;;
            show)
              case " ${FAKE_EMBED:-} " in
                *" $2 "*) printf '  Capabilities\n    embedding\n\n' ;;
                *)        printf '  Capabilities\n    completion\n\n' ;;
              esac ;;
          esac
          EOF
          cat > "$RUNNER_TEMP/fakebin/df" <<'EOF'
          #!/bin/bash
          if [ -n "${FAKE_DISK_GB:-}" ] && [ "$1" = "-g" ]; then
            echo "Filesystem 1G-blocks Used Available Capacity Mounted"
            echo "/dev/disk1 1000 900 $FAKE_DISK_GB 90% /"
          elif [ "$1" = "-g" ]; then
            exit 1
          else
            exec /bin/df "$@"
          fi
          EOF
          chmod +x "$RUNNER_TEMP/fakebin/sysctl" "$RUNNER_TEMP/fakebin/ioreg" \
            "$RUNNER_TEMP/fakebin/ollama" "$RUNNER_TEMP/fakebin/df"

      - name: 'Speed gate: dense models over the chip cap are skipped, MoE is exempt'
        run: |
          . "$RUNNER_TEMP/simulate.sh"
          dense="$RUNNER_TEMP/dense.catalog"
          printf '%s\n' '# Last-Updated: 2026-09-30' \
            '48|test-dense:70b|43|dense|daily|yes|synthetic' \
            '8|test-small:3b|2|dense|daily|yes|synthetic' > "$dense"
          moe="$RUNNER_TEMP/moe.catalog"
          printf '%s\n' '# Last-Updated: 2026-09-30' \
            '48|test-moe:70b|43|moe|daily|yes|synthetic' \
            '8|test-small:3b|2|dense|daily|yes|synthetic' > "$moe"
          label="M4 Pro 64GB, dense 43GB"; out="$(simulate 'Apple M4 Pro' 12 64 '' "$dense")"
          expect 'daily: +test-small:3b$'; reject 'test-dense:70b'
          label="M4 Max 14c 64GB (410 GB/s), dense 43GB"; out="$(simulate 'Apple M4 Max' 14 64 '' "$dense")"
          reject 'test-dense:70b'
          label="M4 Max 16c 64GB (546 GB/s), dense 43GB"; out="$(simulate 'Apple M4 Max' 16 64 '' "$dense")"
          expect 'daily: +test-dense:70b$'
          label="M4 Pro 64GB, MoE 43GB"; out="$(simulate 'Apple M4 Pro' 12 64 '' "$moe")"
          expect 'daily: +test-moe:70b$'

      - name: 'Bandwidth table: every binned chip resolves to the right bin'
        run: |
          . "$RUNNER_TEMP/simulate.sh"
          bw() { label="$1 ncpu=$2 ram=$3 gpu=${4:-none}"; out="$(simulate "$1" "$2" "$3" "${4:-}")"; expect "Memory bandwidth: +$5 GB/s"; }
          bw 'Apple M1'        8 16 ''  68
          bw 'Apple M3 Pro'   11 36 ''  150
          bw 'Apple M3 Max'   14 36 ''  300
          bw 'Apple M3 Max'   16 48 ''  400
          bw 'Apple M4 Max'   14 36 ''  410
          bw 'Apple M4 Max'   16 64 ''  546
          bw 'Apple M5 Max'   18 36 32  460
          bw 'Apple M5 Max'   18 128 40 614
          bw 'Apple M5 Max'   18 36 ''  460
          bw 'Apple M5 Max'   18 64 ''  614
          bw 'Apple M5 Ultra' 36 256 '' 1200
          bw 'Apple M6'       12 16 ''  153
          bw 'Apple M6'       12 24 ''  170
          bw 'Apple M1 (Virtual)' 3 7 '' 68

      - name: 'Unrecognised future Apple chip takes the newest known generation'
        run: |
          . "$RUNNER_TEMP/simulate.sh"
          label="M7";       out="$(simulate 'Apple M7'       10 16 '')";  expect 'Memory bandwidth: +153 GB/s'
          label="M7 Pro";   out="$(simulate 'Apple M7 Pro'   14 48 '')";  expect 'Memory bandwidth: +307 GB/s'
          label="M7 Max";   out="$(simulate 'Apple M7 Max'   18 64 '')";  expect 'Memory bandwidth: +460 GB/s'
          label="M7 Ultra"; out="$(simulate 'Apple M7 Ultra' 36 256 '')"; expect 'Memory bandwidth: +1200 GB/s'

      - name: 'Shipped catalogue: representative picks'
        run: |
          . "$RUNNER_TEMP/simulate.sh"
          label="M4 Pro 64GB"; out="$(simulate 'Apple M4 Pro' 12 64 '')"
          expect 'daily: +qwen3.6:35b-a3b$'; expect 'reasoning: +qwen3.8:27b$'
          label="M3 Pro 36GB (dense 27B too slow)"; out="$(simulate 'Apple M3 Pro' 11 36 '')"
          expect 'reasoning: +gemma4:26b-a4b-it-qat$'; reject 'qwen3.8:27b'
          label="M4 32GB"; out="$(simulate 'Apple M4' 10 32 '')"
          expect 'daily: +gemma4:26b-a4b-it-qat$'; expect 'coding: +qwen3.5:9b$'
          label="M1 8GB"; out="$(simulate 'Apple M1' 8 8 '')"
          expect 'daily: +qwen3.5:4b$'; expect 'light: +granite4.2:3b$'
          label="7 GB VM (GitHub macOS runner size)"; out="$(simulate 'Apple M1 (Virtual)' 3 7 '')"
          expect 'light: +granite4.2:3b$'

      - name: 'Non-Apple host: sized by memory alone, no dense-speed cap'
        run: |
          set +e
          output=$(./llmstack-macos.sh --recommend 2>&1)
          echo "$output" | grep -q 'no dense-speed cap applied' \
            || { echo "FAIL: expected no dense-speed cap on a non-Apple host"; echo "$output"; exit 1; }
          echo "Memory-only sizing confirmed"

      # ---------------------------------------------------------------------
      # --sync-models (v3.5.0), against the stub ollama. Picks on a 64 GB
      # M4 Pro: qwen3.6:35b-a3b (daily, vision), qwen3.8:27b (reasoning),
      # qwen3.6:35b-a3b-coding (coding), granite4.2:3b (light).
      # ---------------------------------------------------------------------
      - name: 'Sync: pulls only chosen picks, removes only models answered yes'
        run: |
          . "$RUNNER_TEMP/simulate.sh"
          label="sync happy path"
          export FAKE_OLLAMA_MODELS="llama3.3:70b qwen2.5:32b-instruct nomic-embed-text qwen3.8:27b"
          export FAKE_EMBED="nomic-embed-text:latest"
          # pulls: qwen3.6 y, coding n, granite y | removals: llama3.3 y, qwen2.5 n, nomic n
          sync 'Apple M4 Pro' 12 64 'y n y y n n'
          [ "$SYNC_RC" -eq 0 ] || { echo "FAIL: exit $SYNC_RC"; exit 1; }
          called 'pull qwen3.6:35b-a3b'; called 'pull granite4.2:3b'
          not_called 'pull qwen3.6:35b-a3b-coding'; not_called 'pull qwen3.8:27b'
          called 'rm llama3.3:70b'; not_called 'rm qwen2.5:32b-instruct'; not_called 'rm nomic-embed-text:latest'
          not_called 'rm qwen3.8:27b'
          expect 'Embedding model'
          # every pull must be logged before the first rm
          last_pull=$(grep -n '^pull ' "$RUNNER_TEMP/ollama.log" | tail -1 | cut -d: -f1)
          first_rm=$(grep -n '^rm ' "$RUNNER_TEMP/ollama.log" | head -1 | cut -d: -f1)
          [ "$last_pull" -lt "$first_rm" ] || { echo "FAIL: a removal ran before the pulls finished"; exit 1; }
          echo "ok   pulls all precede removals"

      - name: 'Sync: a failed pull prevents every removal'
        run: |
          . "$RUNNER_TEMP/simulate.sh"
          label="sync pull failure"
          export FAKE_OLLAMA_MODELS="llama3.3:70b"
          export FAKE_PULL_FAIL="qwen3.6:35b-a3b"
          sync 'Apple M4 Pro' 12 64 'y y y y y y y y'
          [ "$SYNC_RC" -eq 1 ] || { echo "FAIL: expected exit 1, got $SYNC_RC"; exit 1; }
          called 'pull qwen3.6:35b-a3b'; not_called 'rm llama3.3:70b'
          expect 'no models were removed'

      - name: 'Sync: Ollama not running exits 1 and changes nothing'
        run: |
          . "$RUNNER_TEMP/simulate.sh"
          label="sync daemon down"
          export FAKE_OLLAMA_DOWN=1
          sync 'Apple M4 Pro' 12 64 'y y y y'
          [ "$SYNC_RC" -eq 1 ] || { echo "FAIL: expected exit 1, got $SYNC_RC"; exit 1; }
          expect 'Nothing was changed'
          ! grep -qE '^(pull|rm) ' "$RUNNER_TEMP/ollama.log" || { echo "FAIL: pull or rm was called"; exit 1; }
          echo "ok   no pull or rm"

      - name: 'Sync: stale catalogue is replaced only on yes, with a backup'
        run: |
          . "$RUNNER_TEMP/simulate.sh"
          old="$RUNNER_TEMP/old.catalog"
          printf '%s\n' '# Last-Updated: 2026-08-09' '8|qwen2.5:7b-instruct|5|dense|daily|yes|old' > "$old"
          export FAKE_OLLAMA_MODELS="qwen2.5:7b-instruct"
          label="stale, answer no"; sync 'Apple M4 Pro' 12 64 'n n' "$old"
          expect 'dated 2026-08-09'
          grep -q '^# Last-Updated: 2026-08-09' "$SYNC_HOME/.config/llmstack/models.catalog" \
            || { echo "FAIL: catalogue changed despite no"; exit 1; }
          echo "ok   [$label] catalogue unchanged"
          # yes to refresh, then decline all pulls and the removal
          label="stale, answer yes"; sync 'Apple M4 Pro' 12 64 'y n n n n' "$old"
          grep -q '^# Last-Updated: 2026-09-30' "$SYNC_HOME/.config/llmstack/models.catalog" \
            || { echo "FAIL: catalogue not replaced"; exit 1; }
          ls "$SYNC_HOME"/.config/llmstack/models.catalog.backup-* >/dev/null \
            || { echo "FAIL: no backup written"; exit 1; }
          expect 'qwen3.6:35b-a3b'
          echo "ok   [$label] replaced, backup kept, new picks shown"

      - name: 'Sync: disk shortfall stops before any pull'
        run: |
          . "$RUNNER_TEMP/simulate.sh"
          label="sync disk short"
          export FAKE_OLLAMA_MODELS="llama3.3:70b" FAKE_DISK_GB=20
          sync 'Apple M4 Pro' 12 64 'y y y y y'
          [ "$SYNC_RC" -eq 1 ] || { echo "FAIL: expected exit 1, got $SYNC_RC"; exit 1; }
          expect 'Nothing was changed'
          ! grep -qE '^(pull|rm) ' "$RUNNER_TEMP/ollama.log" || { echo "FAIL: pull or rm was called"; exit 1; }
          echo "ok   no pull or rm"

      - name: '--recommend stays read-only and points to --sync-models'
        run: |
          . "$RUNNER_TEMP/simulate.sh"
          label="recommend pointer"; out="$(simulate 'Apple M4 Pro' 12 64 '')"
          expect '--sync-models'

      # ---------------------------------------------------------------------
      # Live tag guard (replaces the old static "fictional tag" blocklist,
      # which banned llama3.3:70b and qwen3.6:35b-a3b — both real).
      # Runs BEFORE the registry is blackholed below. A 404 fails the job;
      # any other status is a registry problem, reported as a warning so CI
      # does not depend on Ollama's uptime.
      # ---------------------------------------------------------------------
      - name: 'Every shipped catalogue tag exists in the Ollama registry'
        run: |
          cat="$HOME/.config/llmstack/models.catalog"
          dead=0; unknown=0; live=0
          tags=$(grep -v '^#' "$cat" | grep -v '^$' \
            | awk -F'|' '{ gsub(/^[ \t]+|[ \t]+$/, "", $2); print $2 }' | sort -u)
          for tag in $tags; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              "https://registry.ollama.ai/v2/library/${tag%%:*}/manifests/${tag##*:}") || code="000"
            case "$code" in
              200) echo "LIVE     $tag"; live=$((live+1)) ;;
              404) echo "::error::DEAD $tag (404: retired, renamed or never existed)"; dead=$((dead+1)) ;;
              *)   echo "::warning::UNKNOWN $tag (HTTP $code)"; unknown=$((unknown+1)) ;;
            esac
          done
          echo "Summary: $live live, $dead dead, $unknown unknown"
          [ "$dead" -eq 0 ] || exit 1

      # ---------------------------------------------------------------------
      # Idempotency
      # ---------------------------------------------------------------------
      - name: '--recommend is idempotent (run twice, same output)'
        run: |
          set +e
          out1=$(./llmstack-macos.sh --recommend 2>&1)
          out2=$(./llmstack-macos.sh --recommend 2>&1)
          [ "$out1" = "$out2" ] \
            || { echo "FAIL: --recommend produced different output on second run"; exit 1; }
          echo "Idempotent"

      # ---------------------------------------------------------------------
      # Catalogue-maintenance modes (v3.3.0) — offline-safe behaviour.
      # CI has no registry access, so these must exit 0, write no proposal,
      # and leave the live catalogue unchanged.
      # ---------------------------------------------------------------------
      #
      # These modes reach the Ollama registry when it is available. To test
      # the fail-soft path deterministically we must GUARANTEE no registry
      # access — GitHub-hosted runners have open internet, so we cannot just
      # assume it. The step below blackholes registry.ollama.ai and
      # ollama.com to 127.0.0.1, so every curl to them fails fast
      # (connection refused). With the registry unreachable the modes must
      # exit 0, write no proposal, and leave the live catalogue unchanged.
      # ---------------------------------------------------------------------
      - name: 'Blackhole the Ollama registry (force offline for the next steps)'
        run: |
          echo "127.0.0.1 registry.ollama.ai" | sudo tee -a /etc/hosts
          echo "127.0.0.1 ollama.com"          | sudo tee -a /etc/hosts
          # Confirm it is genuinely unreachable now.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
            "https://registry.ollama.ai/v2/library/llama3.3/manifests/70b" || echo "000")
          echo "registry probe after blackhole: $code (expect 000/failure)"

      - name: '--help mentions the catalogue-maintenance modes'
        run: |
          output=$(./llmstack-macos.sh --help)
          for m in --check-models --refresh-catalog --refresh-catalog-apply --discover; do
            echo "$output" | grep -q -- "$m" \
              || { echo "FAIL: --help does not mention $m"; exit 1; }
          done

      - name: '--check-models exits 0 with no registry access'
        run: |
          set +e
          ./llmstack-macos.sh --check-models >/dev/null 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL: expected exit 0, got $rc"; exit 1; }
          echo "check-models is offline-safe"

      - name: '--refresh-catalog exits 0, writes no proposal, leaves catalogue unchanged'
        run: |
          cat="$HOME/.config/llmstack/models.catalog"
          cp "$cat" /tmp/catalog_before
          set +e
          ./llmstack-macos.sh --refresh-catalog >/dev/null 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL: expected exit 0, got $rc"; exit 1; }
          [ ! -f "${cat}.proposed" ] \
            || { echo "FAIL: a proposal was written with no registry access"; exit 1; }
          diff -q "$cat" /tmp/catalog_before >/dev/null \
            || { echo "FAIL: live catalogue changed"; exit 1; }
          echo "refresh-catalog is offline-safe and non-destructive"

      - name: '--refresh-catalog-apply exits 0 and leaves catalogue unchanged offline'
        run: |
          cat="$HOME/.config/llmstack/models.catalog"
          cp "$cat" /tmp/catalog_before2
          set +e
          ./llmstack-macos.sh --refresh-catalog-apply >/dev/null 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL: expected exit 0, got $rc"; exit 1; }
          diff -q "$cat" /tmp/catalog_before2 >/dev/null \
            || { echo "FAIL: live catalogue changed with no registry access"; exit 1; }
          echo "refresh-catalog-apply is offline-safe"

      - name: '--refresh-catalog --discover is offline-safe (scrape fails soft)'
        run: |
          cat="$HOME/.config/llmstack/models.catalog"
          cp "$cat" /tmp/catalog_before3
          set +e
          ./llmstack-macos.sh --refresh-catalog --discover >/dev/null 2>&1
          rc=$?
          [ "$rc" -eq 0 ] || { echo "FAIL: expected exit 0, got $rc"; exit 1; }
          [ ! -f "${cat}.proposed" ] \
            || { echo "FAIL: a proposal was written with no registry access"; exit 1; }
          diff -q "$cat" /tmp/catalog_before3 >/dev/null \
            || { echo "FAIL: live catalogue changed"; exit 1; }
          echo "discover scrape is offline-safe and non-destructive"

  # ===========================================================================
  # macOS Tests — runs on Apple Silicon; tests real hardware detection
  # Conditional to conserve macOS runner minutes (10x billing rate)
  # ===========================================================================
  test-macos:
    name: macOS Tests
    runs-on: macos-latest
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Make executable
        run: chmod +x llmstack-macos.sh

      - name: Syntax check
        run: bash -n llmstack-macos.sh

      - name: Shellcheck (brew)
        run: |
          brew install shellcheck
          shellcheck --version
          shellcheck -x llmstack-macos.sh

      - name: '--recommend detects real Apple Silicon hardware'
        run: |
          set +e
          output=$(./llmstack-macos.sh --recommend 2>&1)
          rc=$?
          echo "$output"
          [ "$rc" -eq 0 ] || { echo "FAIL: --recommend exited with code $rc"; exit 1; }
          echo "$output" | grep -q "DETECTED SYSTEM" \
            || { echo "FAIL: no DETECTED SYSTEM header"; exit 1; }
          echo "$output" | grep -q "Chip:.*unknown" \
            && { echo "FAIL: chip detected as unknown on Apple Silicon"; exit 1; } \
            || echo "Chip detected correctly"

      - name: '--recommend shows non-zero memory'
        run: |
          set +e
          output=$(./llmstack-macos.sh --recommend 2>&1)
          mem_line=$(echo "$output" | grep "Unified memory:")
          echo "$mem_line"
          mem=$(echo "$mem_line" | grep -oE '[0-9]+' | head -1)
          [ -n "$mem" ] && [ "$mem" -gt 0 ] \
            || { echo "FAIL: memory not detected or zero"; exit 1; }
          echo "Memory detected: ${mem} GB"

      - name: '--recommend shows non-zero disk space'
        run: |
          set +e
          output=$(./llmstack-macos.sh --recommend 2>&1)
          disk_line=$(echo "$output" | grep "Free disk:")
          echo "$disk_line"
          disk=$(echo "$disk_line" | grep -oE '[0-9]+' | head -1)
          [ -n "$disk" ] && [ "$disk" -gt 0 ] \
            || { echo "FAIL: disk space not detected or zero"; exit 1; }
          echo "Free disk: ${disk} GB"

      - name: '--recommend assigns a chip tier'
        run: |
          set +e
          output=$(./llmstack-macos.sh --recommend 2>&1)
          tier_line=$(echo "$output" | grep "Tier:")
          echo "$tier_line"
          echo "$tier_line" | grep -qE 'Tier:\s+(Ultra|Max|Pro|Base)' \
            || { echo "FAIL: no valid chip tier assigned"; exit 1; }

      - name: '--recommend shows bandwidth note for detected tier'
        run: |
          set +e
          output=$(./llmstack-macos.sh --recommend 2>&1)
          echo "$output" | grep -qi "tier" \
            || { echo "FAIL: no bandwidth note"; exit 1; }

      - name: '--recommend recommends at least one model'
        run: |
          set +e
          output=$(./llmstack-macos.sh --recommend 2>&1)
          echo "$output"
          # Check for any role label followed by a colon
          echo "$output" | grep -qE '(daily|coding|vision|light|reasoning):' \
            || { echo "FAIL: no model recommended"; exit 1; }
          echo "At least one model recommended"

      - name: '--status shows all components'
        run: |
          set +e
          output=$(./llmstack-macos.sh --status 2>&1)
          rc=$?
          echo "$output"
          echo "Exit code: $rc"
          echo "$output" | grep -q "Ollama" \
            || { echo "FAIL: no Ollama line"; exit 1; }
          echo "$output" | grep -q "Open WebUI" \
            || { echo "FAIL: no Open WebUI line"; exit 1; }
          echo "$output" | grep -q "SearXNG" \
            || { echo "FAIL: no SearXNG line"; exit 1; }

      - name: 'Catalogue written and valid on macOS'
        run: |
          [ -f "$HOME/.config/llmstack/models.catalog" ] \
            || { echo "FAIL: catalogue not written"; exit 1; }
          grep -v '^#' "$HOME/.config/llmstack/models.catalog" \
            | grep -v '^$' \
            | awk -F'|' '{ if (NF != 7) { printf "FAIL: %d fields: %s\n", NF, $0; exit 1 } }'
          echo "Catalogue valid"

      - name: '--recommend reports a memory bandwidth for the real chip'
        run: |
          set +e
          output=$(./llmstack-macos.sh --recommend 2>&1)
          echo "$output" | grep -E 'Chip:|Memory bandwidth:|Dense model cap:'
          echo "$output" | grep -qE 'Memory bandwidth: +[0-9]+ GB/s' \
            || { echo "FAIL: no bandwidth resolved for this Apple Silicon chip"; exit 1; }

  # ===========================================================================
  # Summary job — useful for branch protection rules
  # ===========================================================================
  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Check job results
        run: |
          lint="${{ needs.lint.result }}"
          test="${{ needs.test.result }}"
          echo "Lint: $lint"
          echo "Test: $test"
          [ "$lint" = "success" ] && [ "$test" = "success" ] \
            || { echo "FAIL: one or more jobs failed"; exit 1; }
          echo "All required jobs passed"
